    <!--
      Resolve the theme before first paint so the page never flashes light.

      Inline, so it runs with no round trip — which means the Content-Security-
      Policy in vercel.json has to allowlist it by sha256 hash. Editing this by
      one character invalidates the hash and the browser silently refuses to run
      it. `npm run build` recomputes and verifies the hash, and fails the build
      on a mismatch, so this cannot ship broken. Run `npm run csp:hash -- --write`
      to update vercel.json after an intentional edit.
    -->
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') {
          var m = document.getElementById('themeColor');
          if (m) m.setAttribute('content', '#0c0c0c');
        }
      })();
    </script>
